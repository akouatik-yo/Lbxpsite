<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Geek des Bois</title>
<meta name="description" content="Le site de Yoann, depuis sa cabane en forêt. En construction.">
<style>
  :root { --fond: #f4f1ea; --texte: #2b2a26; --discret: #6b675d; }
  @media (prefers-color-scheme: dark) { :root { --fond: #1c1d1a; --texte: #e8e4d9; --discret: #a29d90; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--fond); color: var(--texte); font: 18px/1.6 Georgia, "Times New Roman", serif;
         display: grid; place-items: center; padding: 0 16px; }
  main { max-width: 32rem; text-align: center; }
  h1 { font-weight: normal; font-size: 2.2rem; margin: 0 0 .5rem; }
  p { margin: .4rem 0; }
  .discret { color: var(--discret); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>Le Geek des Bois</h1>
  <p>Le site est en construction, quelque part en forêt.</p>
  <p class="discret">Page provisoire, en attendant la maquette.</p>
</main>
</body>
</html>
