  const POLICE = '"ArchivoMasque", "Segoe UI", Roboto, "Helvetica Neue", Arial, system-ui, sans-serif';

  const MOT = 'BIENTÔT';

  /* gamme de verts (note de direction artistique) : sombres nombreux, lumineux rares */
  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.substr(i, 2), 16) / 255);
  const VERTS = [
    ['#0B2418', 0.22], ['#17402A', 0.26], ['#2C6234', 0.22], // forêt profonde, sous-bois, mousse
    ['#4F8A3A', 0.15], ['#86B843', 0.10],                    // fougère, lichen

  ].map(([h, p]) => [hex(h), p]);
  const ACIDE = hex('#D6F51A'), IVOIRE = hex('#FFF5DF');

  /* ───────── WebGL : programmes ───────── */
  function shader(type, src) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));

  }
  function prog(vs, fs, attrs) {
    const p = gl.createProgram();
    gl.attachShader(p, shader(gl.VERTEX_SHADER, '#version 300 es\nprecision highp float;\n' + vs));
    gl.attachShader(p, shader(gl.FRAGMENT_SHADER, '#version 300 es\nprecision mediump float;\n' + fs));
    (attrs || []).forEach((a, i) => gl.bindAttribLocation(p, i, a));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) { const nm = gl.getActiveUniform(p, i).name; u[nm] = gl.getUniformLocation(p, nm); }
    return { p, u };
  }
  const VS_PLEIN = 'out vec2 v;void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));v=p;gl_Position=vec4(p*2.-1.,0.,1.);}';
  let P;
  try {
    P = {
      // hyphes : quads antialiasés accumulés (rgb = verts, a = blanc)
      seg: prog(
        'layout(location=0) in vec2 a_p;layout(location=1) in float a_n;layout(location=2) in vec4 a_c;uniform vec2 u_res;out float vn;out vec4 vc;' +
        'void main(){vn=a_n;vc=a_c;gl_Position=vec4(a_p.x/u_res.x*2.-1.,1.-a_p.y/u_res.y*2.,0.,1.);}',
        'in float vn;in vec4 vc;out vec4 o;void main(){float k=1.-vn*vn;o=vc*k;}', ['a_p', 'a_n', 'a_c']),
      // pointes et impulsions
      pt: prog(
        'layout(location=0) in vec2 a_p;layout(location=1) in float a_s;layout(location=2) in vec4 a_c;uniform vec2 u_res;uniform float u_dpr;out vec4 vc;' +
        'void main(){vc=a_c;gl_PointSize=a_s*u_dpr;gl_Position=vec4(a_p.x/u_res.x*2.-1.,1.-a_p.y/u_res.y*2.,0.,1.);}',
        'in vec4 vc;out vec4 o;void main(){vec2 d=gl_PointCoord*2.-1.;float r=dot(d,d);o=vec4(vc.rgb*vc.a*exp(-r*4.5),0.);}', ['a_p', 'a_s', 'a_c']),
      // réduction + tonalité pour le halo
      bas: prog(VS_PLEIN,
        'in vec2 v;uniform sampler2D u_t;uniform sampler2D u_m;out vec4 o;void main(){vec4 a=texture(u_t,v);float m=texture(u_m,vec2(v.x,1.-v.y)).r;' +
        'vec3 g=(1.-exp(-a.rgb*1.3))*(1.-.8*m);float w=1.-exp(-a.a*1.5);o=vec4(g,w);}'),
      flou: prog(VS_PLEIN,
        'in vec2 v;uniform sampler2D u_t;uniform vec2 u_d;out vec4 o;void main(){' +
        'o=texture(u_t,v)*.2270270270+(texture(u_t,v+u_d*1.3846153846)+texture(u_t,v-u_d*1.3846153846))*.3162162162' +
        '+(texture(u_t,v+u_d*3.2307692308)+texture(u_t,v-u_d*3.2307692308))*.0702702703;}'),
      // composition finale : tonalité, masque du mot, halo, vignettage, grain
      fin: prog(VS_PLEIN,
        'in vec2 v;uniform sampler2D u_t;uniform sampler2D u_b1;uniform sampler2D u_b2;uniform sampler2D u_m;uniform float u_tps;uniform float u_eclat;uniform vec2 u_px;out vec4 o;' +
        'float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}' +
        'void main(){vec4 a=texture(u_t,v);float m=texture(u_m,vec2(v.x,1.-v.y)).r;' +
        'vec2 e=min(v,1.-v)/u_px;float fb=smoothstep(0.,26.,min(e.x,e.y));' +
        'vec3 g=(1.-exp(-a.rgb*1.25))*(1.-.88*m)*fb;float w=1.-exp(-a.a*u_eclat);' +
        'vec3 c=g+w*vec3(1.,.96,.875);' +
        'vec4 b=texture(u_b1,v)*.5+texture(u_b2,v)*.5;' +
        'c+=b.rgb*.32+b.a*vec3(1.,.96,.875)*.38;' +
        'vec2 r=(v-.5)*vec2(u_px.y/u_px.x,1.);c*=1.+.07*sin(u_tps*.785398-length(r)*9.);' +
        'vec2 q=v-.5;c*=1.-smoothstep(.35,.95,length(q*vec2(1.15,1.)))*.55;' +
        'float l=dot(c,vec3(.3,.5,.2));c+=(h(v/u_px+fract(u_tps*7.3))-.5)*(.012+.05*l);' +
        'o=vec4(max(c,0.),1.);}'),
    };
  } catch (e) { console.warn('WebGL indisponible :', e.message); return; }

  gl.getExtension('EXT_color_buffer_float');
  const halfOK = !!(gl.getExtension('EXT_color_buffer_half_float') || gl.getExtension('EXT_color_buffer_float'));
  const vaoVide = gl.createVertexArray();

  /* tampons dynamiques */
  const SEG_MAX = 6000, SEG_F = 7 * 6; // 6 sommets × (x, y, n, r, g, b, a)
  const segData = new Float32Array(SEG_MAX * SEG_F);
  const segVBO = gl.createBuffer(), segVAO = gl.createVertexArray();
  gl.bindVertexArray(segVAO); gl.bindBuffer(gl.ARRAY_BUFFER, segVBO);
  gl.bufferData(gl.ARRAY_BUFFER, segData.byteLength, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 28, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 1, gl.FLOAT, false, 28, 8);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 28, 12);
  const PT_MAX = 4000, ptData = new Float32Array(PT_MAX * 7);
  const ptVBO = gl.createBuffer(), ptVAO = gl.createVertexArray();
  gl.bindVertexArray(ptVAO); gl.bindBuffer(gl.ARRAY_BUFFER, ptVBO);

  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 1, gl.FLOAT, false, 28, 8);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 28, 12);

  function cible(w, h, flottant) {
    const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
    if (flottant) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
    else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    return ok ? { t, f, w, h } : null;
  }

  /* ───────── état du monde ───────── */
  let W, H, dpr, RW, RH, kS, kL, T, S, acc, b1a, b1b, b2a, b2b, masqueTex = null;

  function construire() {
    W = Math.max(1, innerWidth); H = Math.max(1, innerHeight);
    dpr = Math.min(devicePixelRatio || 1, 1.5);
    while (W * H * dpr * dpr > 2.4e6 && dpr > 1) dpr = Math.max(1, dpr - 0.25);
    RW = Math.round(W * dpr); RH = Math.round(H * dpr);
    toile.width = RW; toile.height = RH;
    kS = clamp(Math.min(W, H) / 800, 0.6, 1.4);
    for (const c of [acc, b1a, b1b, b2a, b2b]) if (c) { gl.deleteTexture(c.t); gl.deleteFramebuffer(c.f); }
    acc = (halfOK && cible(RW, RH, true)) || cible(RW, RH, false);
    const w4 = Math.max(1, RW >> 2), h4 = Math.max(1, RH >> 2), w8 = Math.max(1, RW >> 3), h8 = Math.max(1, RH >> 3);
    b1a = cible(w4, h4, false); b1b = cible(w4, h4, false); b2a = cible(w8, h8, false); b2b = cible(w8, h8, false);
    S = monde();
    T = 0;
  }

  /* le mot : masque, champ de distance signé (px CSS, négatif à l'intérieur) */
  function lettres() {
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d');
    const portrait = H > W * 1.1;
    let fs = 100; g.font = `800 ${fs}px ${POLICE}`;
    const esp = 0.05;
    const largeur = (f) => { g.font = `800 ${f}px ${POLICE}`; return g.measureText(MOT).width + f * esp * (MOT.length - 1); };
    fs = Math.min((W * (portrait ? 0.94 : 0.8)) / (largeur(100) / 100), H * 0.3);
    g.font = `800 ${fs}px ${POLICE}`;
    const m = g.measureText(MOT), asc = m.actualBoundingBoxAscent || fs * 0.95, desc = m.actualBoundingBoxDescent || 0;
    const L = largeur(fs), y0 = H * 0.5 + (asc - desc) / 2;
    const ecrire = (ctx) => {
      ctx.font = `800 ${fs}px ${POLICE}`; ctx.textBaseline = 'alphabetic';
      let x = (W - L) / 2;
      for (const ch of MOT) { ctx.fillText(ch, x, y0); x += ctx.measureText(ch).width + fs * esp; }
    };
    g.fillStyle = '#fff'; ecrire(g);
    const img = g.getImageData(0, 0, W, H).data;
    const LC = 3, LW = Math.ceil(W / LC), LH = Math.ceil(H / LC), n = LW * LH;
    const dedans = new Uint8Array(n), dehors = new Uint8Array(n);
    let aire = 0;
    for (let y = 0; y < LH; y++) for (let x = 0; x < LW; x++) {
      const px = Math.min(W - 1, x * LC + 1), py = Math.min(H - 1, y * LC + 1);
      const i = y * LW + x, v = img[(py * W + px) * 4 + 3] > 127;
      dedans[i] = v ? 1 : 0; dehors[i] = v ? 0 : 1; if (v) aire++;
    }
    const chanfrein = (src) => {
      const d = new Float32Array(n).fill(1e6);
      for (let i = 0; i < n; i++) if (src[i]) d[i] = 0;
      const R = 1.4142;
      for (let y = 0; y < LH; y++) for (let x = 0; x < LW; x++) {
        const i = y * LW + x; let v = d[i];
        if (x > 0) v = Math.min(v, d[i - 1] + 1);
        if (y > 0) { v = Math.min(v, d[i - LW] + 1); if (x > 0) v = Math.min(v, d[i - LW - 1] + R); if (x < LW - 1) v = Math.min(v, d[i - LW + 1] + R); }
        d[i] = v;
      }
      for (let y = LH - 1; y >= 0; y--) for (let x = LW - 1; x >= 0; x--) {
        const i = y * LW + x; let v = d[i];
        if (x < LW - 1) v = Math.min(v, d[i + 1] + 1);
        if (y < LH - 1) { v = Math.min(v, d[i + LW] + 1); if (x < LW - 1) v = Math.min(v, d[i + LW + 1] + R); if (x > 0) v = Math.min(v, d[i + LW - 1] + R); }
        d[i] = v;
      }
      return d;
    };
    const dOut = chanfrein(dedans), dIn = chanfrein(dehors), SD = new Float32Array(n);
    let epais = 0;
    for (let i = 0; i < n; i++) { SD[i] = (dOut[i] - dIn[i]) * LC; if (dedans[i]) epais = Math.max(epais, dIn[i] * LC); }
    // masque adouci pour la composition : les verts ne passent jamais sur le mot
    const c2 = document.createElement('canvas'); c2.width = Math.ceil(W / 2); c2.height = Math.ceil(H / 2);
    const g2 = c2.getContext('2d'); g2.scale(0.5, 0.5);
    g2.fillStyle = '#000'; g2.fillRect(0, 0, W, H);
    g2.filter = `blur(${Math.max(2, fs * 0.07)}px)`;
    g2.fillStyle = '#fff'; g2.strokeStyle = '#fff'; g2.lineWidth = fs * 0.16; g2.lineJoin = 'round';
    g2.font = `800 ${fs}px ${POLICE}`;
    { let x = (W - L) / 2; for (const ch of MOT) { g2.strokeText(ch, x, y0); g2.fillText(ch, x, y0); x += g2.measureText(ch).width + fs * esp; } }
    if (!masqueTex) masqueTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, masqueTex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c2);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const sd = (x, y) => {
      const gx = (x / LC) | 0, gy = (y / LC) | 0;
      return gx < 0 || gy < 0 || gx >= LW || gy >= LH ? 1e4 : SD[gy * LW + gx];
    };
    // l'accent du Ô : la part du glyphe au-dessus du O
    const ACC = new Uint8Array(n);
    let accent = null;
    {
      g.font = `800 ${fs}px ${POLICE}`;
      let x = (W - L) / 2, xO = 0, wO = 0;
      for (const ch of MOT) { const w = g.measureText(ch).width; if (ch === 'Ô') { xO = x; wO = w; } x += w + fs * esp; }
      const mO = g.measureText('O'), hautO = y0 - (mO.actualBoundingBoxAscent || fs * 0.72);
      const pts = [];
      for (let y = 0; y < LH; y++) for (let x2 = 0; x2 < LW; x2++) {
        const px = x2 * LC + 1, py = y * LC + 1;
        if (dedans[y * LW + x2] && px >= xO && px <= xO + wO && py < hautO - fs * 0.02) { ACC[y * LW + x2] = 1; pts.push(px, py); }
      }
      if (pts.length >= 12) {
        let x0 = 1e9, x1 = -1e9;
        for (let i = 0; i < pts.length; i += 2) { x0 = Math.min(x0, pts[i]); x1 = Math.max(x1, pts[i]); }

  }

  function monde() {

    // puis les verts, lentement, depuis les bords et les vides

    gl.useProgram(P.flou.p);
    tex(0, b1a.t, P.flou.u.u_t); gl.uniform2f(P.flou.u.u_d, 1 / b1a.w, 0); passe(P.flou, b1b.f, b1b.w, b1b.h);
    tex(0, b1b.t, P.flou.u.u_t); gl.uniform2f(P.flou.u.u_d, 0, 1 / b1a.h); passe(P.flou, b1a.f, b1a.w, b1a.h);
    tex(0, b1a.t, P.flou.u.u_t); gl.uniform2f(P.flou.u.u_d, 1 / b2a.w, 0); passe(P.flou, b2b.f, b2b.w, b2b.h);
    tex(0, b2b.t, P.flou.u.u_t); gl.uniform2f(P.flou.u.u_d, 0, 1 / b2a.h); passe(P.flou, b2a.f, b2a.w, b2a.h);
    tex(0, b2a.t, P.flou.u.u_t); gl.uniform2f(P.flou.u.u_d, 1.6 / b2a.w, 0); passe(P.flou, b2b.f, b2b.w, b2b.h);
    tex(0, b2b.t, P.flou.u.u_t); gl.uniform2f(P.flou.u.u_d, 0, 1.6 / b2a.h); passe(P.flou, b2a.f, b2a.w, b2a.h);
  }

  function composer(anime) {
    gl.disable(gl.BLEND);
    gl.useProgram(P.fin.p);
    tex(0, acc.t, P.fin.u.u_t); tex(1, b1a.t, P.fin.u.u_b1); tex(2, b2a.t, P.fin.u.u_b2); tex(3, masqueTex, P.fin.u.u_m);
    gl.uniform1f(P.fin.u.u_tps, anime ? (T % 800) : 0);
    gl.uniform1f(P.fin.u.u_eclat, 1.15 + 0.35 * lisse(8, 120, T));
    gl.uniform2f(P.fin.u.u_px, 1 / RW, 1 / RH);
    passe(P.fin, null, RW, RH);
    if (!anime) return;
    // pointes vivantes et impulsions, en lumière additive
    let k = 0, n = 0;
    const lim = basse ? 1800 : PT_MAX;
    for (const p of S.pointes) {
      if (n >= lim) break;
      const c = p.k === 0 ? [1, 1, 1] : ACIDE;
      ptData[k++] = p.x; ptData[k++] = p.y; ptData[k++] = p.k === 0 ? 4.5 * S.fin : 3.6;
      ptData[k++] = c[0]; ptData[k++] = c[1]; ptData[k++] = c[2]; ptData[k++] = p.k === 0 ? 0.5 : 0.42 * Math.min(1, 0.4 + 0.6 * S.vigueur);
      n++;
    }
    for (const j of S.jonctions) {
      const a = Math.min(1, (T - j.t) / 1.5) * Math.min(1, 0.4 + j.n * 0.15) * (0.85 + 0.15 * Math.sin(T * 0.785));
      ptData[k++] = j.x; ptData[k++] = j.y; ptData[k++] = 10 * S.fin;
      ptData[k++] = 1; ptData[k++] = 1; ptData[k++] = 1; ptData[k++] = 0.38 * a;
      n++;
    }
    for (const q of S.impulsions) {
      if (n >= PT_MAX) break;
      const x = S.NX[q.n] + (S.NX[q.tgt] - S.NX[q.n]) * q.f, y = S.NY[q.n] + (S.NY[q.tgt] - S.NY[q.n]) * q.f;
      const c = q.k === 0 ? IVOIRE : S.couleurs[q.col] || ACIDE;
      ptData[k++] = x; ptData[k++] = y; ptData[k++] = 5 + 4 * q.b;
      ptData[k++] = Math.min(1, c[0] * 1.6 + 0.12); ptData[k++] = Math.min(1, c[1] * 1.4 + 0.12); ptData[k++] = Math.min(1, c[2] * 1.6 + 0.1); ptData[k++] = q.b * 0.55;
      n++;
    }
    if (!n) return;
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(P.pt.p); gl.uniform2f(P.pt.u.u_res, W, H); gl.uniform1f(P.pt.u.u_dpr, dpr);
    gl.bindVertexArray(ptVAO); gl.bindBuffer(gl.ARRAY_BUFFER, ptVBO);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, ptData, 0, k);
    gl.drawArrays(gl.POINTS, 0, n);
    gl.disable(gl.BLEND);
  }

  /* avance rapide (mouvement réduit, changement d'orientation) */
  function avancer(jusqua) {
    while (T < jusqua) { const h = jusqua - T > 40 && T > 20 ? 1 / 15 : 1 / 30; T += h; S.pas(h, T); if (S.segs.length > 9 * 20000) viderSegments(); }
    viderSegments();
  }

  /* ───────── boucle : sobre, et rien quand l'onglet est caché ───────── */
  let raf = 0, dernier = 0, moyen = 16, mesures = 0;
  function image(now) {
    raf = requestAnimationFrame(image);
    const cible = T > 1200 ? 1 / 15 : T > 720 ? 1 / 24 : 1 / 30;
    if (!dernier) { dernier = now - 1000 / 30; }
    const brut = (now - dernier) / 1000;
    if (cible && brut < cible * 0.92) return;
    dernier = now;
    const dt = Math.min(brut, 0.25);
    if (T > 3 && T < 15) { moyen += (brut * 1000 - moyen) * 0.05; if (++mesures > 90 && moyen > 45) basse = true; }
    // pas fixes : le temps du monde suit l'horloge, même sur un appareil lent
    const n = Math.max(1, Math.ceil(dt / (1 / 30)));
    for (let i = 0; i < n; i++) { T += dt / n; S.pas(dt / n, T); }
    viderSegments();
    cadreN++;
    if (cadreN % (basse || T > 720 ? 4 : 2) === 0 || cadreN < 3) halo();
    composer(true);
  }
  function lancer() {
    cancelAnimationFrame(raf); raf = 0;
    if (ralenti.matches) { if (T < 300) avancer(300); halo(); composer(false); return; } // état mûr, fixe
    if (document.hidden) return;
    dernier = 0; raf = requestAnimationFrame(image);
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else lancer(); });
  ralenti.addEventListener && ralenti.addEventListener('change', lancer);
  let attente = 0, taille = innerWidth + 'x' + innerHeight;
  addEventListener('resize', () => {
    clearTimeout(attente);
    attente = setTimeout(() => {
      if (innerWidth + 'x' + innerHeight === taille) return;
      taille = innerWidth + 'x' + innerHeight;
      const t0 = T; construire(); avancer(Math.min(t0, 25)); halo(); lancer();
    }, 300);
  });
  toile.addEventListener('webglcontextlost', (e) => { e.preventDefault(); cancelAnimationFrame(raf); raf = 0; });
  toile.addEventListener('webglcontextrestored', () => location.reload());

  let parti = false;
  const demarrer = () => {
    if (parti) return; parti = true;
    construire();
    document.documentElement.classList.add('gl');
    // crochets de test (inactifs en usage normal)
    if (window.__mycelium === null) window.__mycelium = { get T() { return T; }, get basse() { return basse; }, get pointes() { return S.pointes.length; }, get couverture() { return S.couverture; } };
    if (window.__myceliumAvance > 0) { avancer(window.__myceliumAvance); halo(); }
    lancer();
  };
  try { const ff = new FontFace('ArchivoMasque', `url(${FONTE})`, { weight: '800' }); document.fonts.add(ff); ff.load().then(demarrer, demarrer); } catch (e) { demarrer(); }
  setTimeout(demarrer, 1500);
})();
</script>
