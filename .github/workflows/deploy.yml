# Déploie le dossier public/ vers public_html chez EX2, à chaque push sur main.
# Les valeurs de connexion sont dans les secrets du dépôt : rien de sensible ici.
name: Déploiement EX2

on:
  push:
    branches: [main]
    paths: ["public/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploiement-ex2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deployer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOTE: ${{ secrets.EX2_HOST }}
      UTILISATEUR: ${{ secrets.EX2_USER }}
      PORT: ${{ secrets.EX2_PORT }}
      PHRASE: ${{ secrets.EX2_SSH_PASSPHRASE }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Préparer la clé SSH
        env:
          CLE: ${{ secrets.EX2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          brut=$(mktemp)
          printf '%s\n' "$CLE" | tr -d '\r' > "$brut"
          # Diagnostic sans rien révéler : forme du texte collé.
          echo "Lignes : $(wc -l < "$brut") ; BEGIN : $(grep -c -- '-----BEGIN' "$brut" || true) ; END : $(grep -c -- '-----END' "$brut" || true) ; PuTTY : $(grep -c 'PuTTY-User-Key-File' "$brut" || true) ; ENCRYPTED : $(grep -c 'ENCRYPTED' "$brut" || true) ; clé publique ssh-rsa : $(grep -c '^ssh-' "$brut" || true) ; ligne la plus longue : $(awk '{ if (length > m) m = length } END { print m+0 }' "$brut")"
          if ! grep -q -- '-----BEGIN' "$brut" && ! grep -q 'PuTTY-User-Key-File' "$brut"; then
            echo "::error::Le secret EX2_SSH_KEY ne contient pas de clé privée complète (pas de ligne -----BEGIN). Recopier toute la clé depuis cPanel."
            exit 1
          fi
          if grep -q 'PuTTY-User-Key-File' "$brut"; then
            echo "Format PuTTY (.ppk) : conversion en OpenSSH."
            sudo apt-get install -y -qq putty-tools >/dev/null
            phr=$(mktemp); printf '%s' "$PHRASE" > "$phr"
            puttygen "$brut" --old-passphrase "$phr" -O private-openssh -o ~/.ssh/id_deploiement
            rm -f "$phr"
          else
            # On ne garde que le bloc BEGIN … END, même entouré d'autre texte.
            sed -n '/-----BEGIN [A-Z ]*PRIVATE KEY-----/,/-----END [A-Z ]*PRIVATE KEY-----/p' "$brut" > ~/.ssh/id_deploiement
            echo "Type : $(head -1 ~/.ssh/id_deploiement | sed 's/-----BEGIN \(.*\) KEY-----/\1/' | tr 'A-Z' 'a-z')"
            chmod 600 ~/.ssh/id_deploiement
            if [ -n "$PHRASE" ] && ! ssh-keygen -y -P "" -f ~/.ssh/id_deploiement >/dev/null 2>&1; then
              ssh-keygen -p -q -P "$PHRASE" -N "" -f ~/.ssh/id_deploiement
            fi
          fi
          rm -f "$brut"
          chmod 600 ~/.ssh/id_deploiement
          ssh-keygen -y -f ~/.ssh/id_deploiement > /dev/null && echo "Clé lisible."
          # Identité du serveur EX2 figée (relevée au premier déploiement, 09/11/2026) :
          # on refuse de se connecter si la clé ED25519 du serveur change.
          ssh-keyscan -t ed25519 -p "$PORT" "$HOTE" > ~/.ssh/known_hosts 2>/dev/null
          attendue='SHA256:WD/eKiwrdZAJ5VQF+NmkqZO3TQKMZnNo1g6qmjdRgO4'
          if ! ssh-keygen -lf ~/.ssh/known_hosts | grep -qF "$attendue"; then
            echo "::error::La clé du serveur ne correspond pas à celle d'EX2 relevée le 09/11/2026. Déploiement arrêté."
            exit 1
          fi
          echo "Serveur EX2 reconnu."
          printf 'Host ex2\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_deploiement\n  IdentitiesOnly yes\n' \
            "$HOTE" "$UTILISATEUR" "$PORT" > ~/.ssh/config

      - name: Tester la connexion
        run: |
          ssh ex2 'echo "Connecté : $(whoami) sur $(hostname)"'

      - name: Envoyer les fichiers
        run: |
          # Manifeste : la liste exacte de ce que le dépôt publie.
          (cd public && find . -type f | sed 's|^\./||' | LC_ALL=C sort) > manifeste.txt
          if grep -qE '(^|/)\.\.(/|$)' manifeste.txt; then echo "::error::Chemin suspect dans public/"; exit 1; fi
          tar -C public -czf - . | ssh ex2 'tar -xzf - -C public_html'
          # Ménage prudent : on ne supprime QUE des fichiers que ce robot avait lui-même déposés
          # (ancien manifeste) et qui ont disparu du dépôt. Les dossiers vides restent.
          ssh ex2 'cat ~/.deploiement-lbxpsite 2>/dev/null || true' | LC_ALL=C sort > ancien.txt
          comm -23 ancien.txt manifeste.txt > a_supprimer.txt
          echo "Fichiers retirés du dépôt, supprimés du serveur : $(wc -l < a_supprimer.txt)"
          cat a_supprimer.txt
          if [ -s a_supprimer.txt ]; then
            ssh ex2 'cd ~/public_html && while IFS= read -r f; do
                case "$f" in ""|/*|*..*|.well-known/*|cgi-bin/*) continue ;; esac
                [ -f "$f" ] && rm -f -- "./$f"
              done' < a_supprimer.txt
          fi
          ssh ex2 'cat > ~/.deploiement-lbxpsite' < manifeste.txt

      - name: Vérifier le site
        run: |
          curl -fsS -o /dev/null -w 'https://legeekdesbois.fr → HTTP %{http_code}\n' https://legeekdesbois.fr/

      - name: Nettoyer
        if: always()
        run: rm -f ~/.ssh/id_deploiement
